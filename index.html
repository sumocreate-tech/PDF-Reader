<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マンガリーダー">
<title>ローカル本・画像リーダー</title>
<style>
  :root {
    --bg: #111;
    --ui-bg: rgba(25, 25, 25, 0.92);
    --text: #eee;
    --accent: #e60012;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100dvh;
    width: 100vw;
    user-select: none;
  }

  /* 初期画面・セットアップ */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    text-align: center;
    gap: 20px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(230, 0, 18, 0.4);
  }
  .btn:active { transform: scale(0.97); }
  .btn-sub {
    background: #333;
    box-shadow: none;
    font-size: 14px;
    padding: 10px 20px;
  }
  input[type="file"] { display: none; }
  .note { font-size: 12px; color: #999; max-width: 400px; line-height: 1.5; }

  /* ビューア画面 */
  #viewer-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100%;
  }
  #media-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 2px;
  }
  /* 見開き（右綴じ: 右が先、左が次） */
  #media-container.rtl { flex-direction: row-reverse; }
  #media-container.ltr { flex-direction: row; }

  .page-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    max-width: 100%;
  }
  .spread-mode .page-slot {
    max-width: 50%;
  }

  canvas, img.page-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
  }
  canvas { background: #fff; }

  /* タップ領域 */
  .tap-zone {
    position: absolute;
    top: 0;
    height: 100%;
    z-index: 10;
  }
  #tap-left { left: 0; width: 32%; }
  #tap-center { left: 32%; width: 36%; }
  #tap-right { right: 0; width: 32%; }

  /* UIオーバーレイ（上下バー） */
  .ui-bar {
    position: absolute;
    left: 0;
    width: 100%;
    background: var(--ui-bg);
    backdrop-filter: blur(8px);
    z-index: 20;
    padding: 12px 16px;
    transition: opacity 0.2s, transform 0.2s;
  }
  #top-bar {
    top: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #bottom-bar {
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  .ui-hidden #top-bar { opacity: 0; transform: translateY(-100%); pointer-events: none; }
  .ui-hidden #bottom-bar { opacity: 0; transform: translateY(100%); pointer-events: none; }

  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .toggle-btn {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle-btn.active { background: var(--accent); border-color: var(--accent); }
  #file-title {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 50%;
  }
  #page-slider {
    width: 100%;
    accent-color: var(--accent);
  }
  #page-slider.rtl { direction: rtl; }
  #loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 30;
    display: none;
  }
</style>
</head>
<body>

  <!-- セットアップ画面 -->
  <div id="setup-screen">
    <h2>マンガ・画像・PDFリーダー</h2>
    <p class="note" id="engine-status">準備中...</p>
    <button class="btn" id="select-folder-btn">フォルダを選択して開く</button>
    <button class="btn btn-sub" id="select-files-btn">複数ファイルを選択</button>
    <input type="file" id="folder-input" webkitdirectory directory multiple>
    <input type="file" id="files-input" accept="image/*,.webp,.avif,.pdf,application/pdf" multiple>
    <p class="note">
      対応形式: WebP / JPG / PNG / GIF / AVIF / BMP / SVG / PDF<br>
      ※画像のみならオフラインでも即動作します。PDFも使う場合は初回のみネット接続状態で開いてキャッシュさせてください。
    </p>
  </div>

  <!-- ビューア画面 -->
  <div id="viewer-screen" class="ui-hidden">
    <div id="top-bar" class="ui-bar">
      <button class="toggle-btn" id="back-btn">← 戻る</button>
      <div id="file-title">タイトル</div>
      <div style="display:flex; gap:6px;">
        <button class="toggle-btn" id="spread-btn">1ページ</button>
        <button class="toggle-btn" id="dir-btn">右綴じ</button>
      </div>
    </div>

    <div id="media-container" class="rtl">
      <div class="page-slot" id="slot-1">
        <canvas id="canvas-1" style="display:none;"></canvas>
        <img id="img-1" class="page-img" style="display:none;" alt="">
      </div>
      <div class="page-slot" id="slot-2" style="display:none;">
        <canvas id="canvas-2" style="display:none;"></canvas>
        <img id="img-2" class="page-img" style="display:none;" alt="">
      </div>
    </div>

    <div id="tap-left" class="tap-zone"></div>
    <div id="tap-center" class="tap-zone"></div>
    <div id="tap-right" class="tap-zone"></div>

    <div id="bottom-bar" class="ui-bar">
      <div class="controls-row">
        <span id="page-info" style="font-size:13px;">1 / 1</span>
        <span style="font-size:11px; color:#aaa;">左タップ:次へ / 中央:メニュー / 右タップ:戻る</span>
      </div>
      <input type="range" id="page-slider" class="rtl" min="0" max="0" value="0">
    </div>

    <div id="loading">読込中...</div>
  </div>

<script>
/**
 * 1. オフライン対応 (Service Worker & Manifest の動的生成)
 */
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const manifest = {
  name: "マンガ・画像リーダー",
  short_name: "リーダー",
  display: "standalone",
  background_color: "#111111",
  theme_color: "#111111",
  start_url: location.href
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestLink = document.createElement('link');
manifestLink.rel = 'manifest';
manifestLink.href = URL.createObjectURL(manifestBlob);
document.head.appendChild(manifestLink);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const swCode = `
    const CACHE_NAME = 'media-reader-v2';
    const ASSETS = [self.location.href, '${PDFJS_CDN}', '${PDFJS_WORKER_CDN}'];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(res => res || fetch(e.request).then(fetchRes => {
          return caches.open(CACHE_NAME).then(cache => {
            if(e.request.method === 'GET') cache.put(e.request, fetchRes.clone());
            return fetchRes;
          });
        }))
      );
    });
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
}

let pdfJsReady = false;
function loadPdfJs() {
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = PDFJS_CDN;
    script.onload = () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_CDN;
      pdfJsReady = true;
      document.getElementById('engine-status').textContent = '準備完了（画像・PDF両対応 / オフラインキャッシュ済）';
      resolve();
    };
    script.onerror = () => {
      document.getElementById('engine-status').textContent = '準備完了（画像モード ※PDF読込には初回ネット接続が必要）';
      resolve();
    };
    document.head.appendChild(script);
  });
}
loadPdfJs();

/**
 * 2. 画像 + PDF 統合リーダーロジック
 */
const IMAGE_EXTS = /\.(webp|jpe?g|png|gif|avif|bmp|svg|ico)$/i;
const PDF_EXT = /\.pdf$/i;

let pagesList = []; // { type: 'image' | 'pdf', file: File, fileName: string, pageNum?: number }
let currentIndex = 0;
let isSpread = false;
let isRtl = true;
let cachedDocs = new Map();
let activeObjectUrls = []; // メモリリーク防止用のURL管理

const setupScreen = document.getElementById('setup-screen');
const viewerScreen = document.getElementById('viewer-screen');
const container = document.getElementById('media-container');
const loadingEl = document.getElementById('loading');
const slider = document.getElementById('page-slider');

document.getElementById('select-folder-btn').onclick = () => document.getElementById('folder-input').click();
document.getElementById('select-files-btn').onclick = () => document.getElementById('files-input').click();
document.getElementById('folder-input').onchange = handleFiles;
document.getElementById('files-input').onchange = handleFiles;

function isSupportedFile(file) {
  // 隠しファイル（Macの .DS_Store や ._ で始まるリソースフォーク）を除外
  if (file.name.startsWith('.')) return false;
  return IMAGE_EXTS.test(file.name) || PDF_EXT.test(file.name) || file.type.startsWith('image/') || file.type === 'application/pdf';
}

async function handleFiles(e) {
  const rawFiles = Array.from(e.target.files).filter(isSupportedFile);
  if (rawFiles.length === 0) {
    alert('対応する画像またはPDFファイルが見つかりませんでした。');
    return;
  }

  // 自然順ソート (01.webp, 2.webp, 10.webp の順に並ぶ)
  rawFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

  setupScreen.style.display = 'none';
  viewerScreen.style.display = 'block';
  loadingEl.style.display = 'block';

  pagesList = [];
  cachedDocs.clear();
  clearObjectUrls();

  for (let i = 0; i < rawFiles.length; i++) {
    const file = rawFiles[i];
    if (PDF_EXT.test(file.name) || file.type === 'application/pdf') {
      if (!pdfJsReady) continue;
      loadingEl.textContent = `ファイル解析中 (${i + 1} / ${rawFiles.length})...`;
      try {
        const arrayBuffer = await file.arrayBuffer();
        const doc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        for (let p = 1; p <= doc.numPages; p++) {
          pagesList.push({ type: 'pdf', file, fileName: file.name, pageNum: p });
        }
        doc.destroy();
      } catch (err) {
        console.error('PDF読込失敗:', file.name, err);
      }
    } else {
      // 画像ファイルはスキャン不要で即リスト化（超高速）
      pagesList.push({ type: 'image', file, fileName: file.name });
    }
  }

  loadingEl.style.display = 'none';
  if (pagesList.length === 0) {
    alert('読み込めるファイルがありませんでした。');
    resetToSetup();
    return;
  }

  currentIndex = 0;
  slider.max = pagesList.length - 1;
  renderCurrentView();
}

function clearObjectUrls() {
  activeObjectUrls.forEach(url => URL.revokeObjectURL(url));
  activeObjectUrls = [];
}

async function getPdfDoc(file) {
  if (cachedDocs.has(file.name)) return cachedDocs.get(file.name);
  if (cachedDocs.size >= 3) {
    const oldestKey = cachedDocs.keys().next().value;
    cachedDocs.get(oldestKey).destroy();
    cachedDocs.delete(oldestKey);
  }
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  cachedDocs.set(file.name, doc);
  return doc;
}

async function renderSlot(slotNum, pageItem, isHalfWidth) {
  const slot = document.getElementById(`slot-${slotNum}`);
  const canvas = document.getElementById(`canvas-${slotNum}`);
  const img = document.getElementById(`img-${slotNum}`);

  if (!pageItem) {
    slot.style.display = 'none';
    canvas.style.display = 'none';
    img.style.display = 'none';
    return;
  }

  slot.style.display = 'flex';

  if (pageItem.type === 'image') {
    canvas.style.display = 'none';
    img.style.display = 'block';
    const url = URL.createObjectURL(pageItem.file);
    activeObjectUrls.push(url);
    img.src = url;
  } else {
    img.style.display = 'none';
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d', { alpha: false });
    const doc = await getPdfDoc(pageItem.file);
    const page = await doc.getPage(pageItem.pageNum);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const targetWidth = (isHalfWidth ? window.innerWidth / 2 : window.innerWidth) * dpr;
    const targetHeight = window.innerHeight * dpr;

    const unscaledViewport = page.getViewport({ scale: 1 });
    const scale = Math.min(targetWidth / unscaledViewport.width, targetHeight / unscaledViewport.height);
    const viewport = page.getViewport({ scale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
  }
}

async function renderCurrentView() {
  if (pagesList.length === 0) return;

  const item1 = pagesList[currentIndex];
  const item2 = (isSpread && currentIndex + 1 < pagesList.length) ? pagesList[currentIndex + 1] : null;

  // PDFが含まれる時だけローディング表示（画像のみなら一瞬で切り替わるため不要）
  const hasPdf = item1.type === 'pdf' || (item2 && item2.type === 'pdf');
  if (hasPdf) loadingEl.style.display = 'block';

  document.getElementById('file-title').textContent = item1.fileName;
  const pageLabel = item2 ? `${currentIndex + 1}-${currentIndex + 2} / ${pagesList.length}` : `${currentIndex + 1} / ${pagesList.length}`;
  document.getElementById('page-info').textContent = pageLabel;
  slider.value = currentIndex;

  container.classList.toggle('spread-mode', isSpread);

  // 前回表示していた画像のメモリを解放
  clearObjectUrls();

  try {
    await Promise.all([
      renderSlot(1, item1, isSpread),
      renderSlot(2, item2, isSpread)
    ]);
  } catch (e) {}

  loadingEl.style.display = 'none';

  // 次ページの先読み（画像ファイルの場合、ブラウザキャッシュに乗せてページめくりをゼロ遅延化）
  const nextIdx = currentIndex + (isSpread ? 2 : 1);
  if (nextIdx < pagesList.length && pagesList[nextIdx].type === 'image') {
    const preloadImg = new Image();
    const preloadUrl = URL.createObjectURL(pagesList[nextIdx].file);
    preloadImg.onload = () => URL.revokeObjectURL(preloadUrl);
    preloadImg.src = preloadUrl;
  }
}

function goNext() {
  const step = isSpread ? 2 : 1;
  if (currentIndex + step < pagesList.length) {
    currentIndex += step;
    renderCurrentView();
  }
}

function goPrev() {
  const step = isSpread ? 2 : 1;
  if (currentIndex - step >= 0) {
    currentIndex -= step;
    renderCurrentView();
  } else if (currentIndex > 0) {
    currentIndex = 0;
    renderCurrentView();
  }
}

document.getElementById('tap-left').onclick = () => isRtl ? goNext() : goPrev();
document.getElementById('tap-right').onclick = () => isRtl ? goPrev() : goNext();
document.getElementById('tap-center').onclick = () => viewerScreen.classList.toggle('ui-hidden');

window.addEventListener('keydown', e => {
  if (viewerScreen.style.display !== 'block') return;
  if (e.key === 'ArrowLeft') isRtl ? goNext() : goPrev();
  if (e.key === 'ArrowRight') isRtl ? goPrev() : goNext();
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderCurrentView, 200);
});

document.getElementById('spread-btn').onclick = (e) => {
  isSpread = !isSpread;
  e.target.textContent = isSpread ? '2ページ見開き' : '1ページ';
  e.target.classList.toggle('active', isSpread);
  renderCurrentView();
};

document.getElementById('dir-btn').onclick = (e) => {
  isRtl = !isRtl;
  e.target.textContent = isRtl ? '右綴じ' : '左綴じ';
  container.className = (isRtl ? 'rtl' : 'ltr') + (isSpread ? ' spread-mode' : '');
  slider.className = isRtl ? 'rtl' : '';
};

slider.oninput = (e) => {
  currentIndex = parseInt(e.target.value, 10);
  renderCurrentView();
};

document.getElementById('back-btn').onclick = resetToSetup;
function resetToSetup() {
  cachedDocs.forEach(doc => doc.destroy());
  cachedDocs.clear();
  clearObjectUrls();
  pagesList = [];
  viewerScreen.style.display = 'none';
  setupScreen.style.display = 'flex';
}
</script>
</body>
</html>
